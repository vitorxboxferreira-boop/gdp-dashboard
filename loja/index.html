<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loja</title>
  <meta name="description" content="Volare Streetwear: tênis, roupas, bonés, skate e acessórios originais. Compra direto no WhatsApp, 5% OFF no Pix e 7x sem juros." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Volare Streetwear" />
  <meta property="og:title" content="Volare Streetwear" />
  <meta property="og:description" content="Streetwear e skate originais. Compra direto no WhatsApp." />
  <meta property="og:image" content="img/logo-volare.png" />
  <meta property="og:locale" content="pt_BR" />
  <meta name="theme-color" content="#09080d" />
  <link rel="icon" type="image/png" href="img/icone.png" />
  <link rel="apple-touch-icon" href="img/icone.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=Permanent+Marker&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/estilo.css" />
  <script>
    // tema: escuro por padrão; aplica o salvo antes de pintar a tela (evita "piscar")
    document.documentElement.dataset.theme = "dark";
    try { const t = localStorage.getItem("tema"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="intro" id="intro" aria-hidden="true"><img src="img/logo-volare.png" alt="" /><span class="intro-barra"></span></div>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <div class="faixa" aria-label="Avisos"><div class="faixa-trilho" id="faixa"></div></div>

  <header class="topo">
    <span class="progresso" id="progresso" aria-hidden="true"></span>
    <div class="topo-in">
      <button class="icone-btn so-mobile" id="btn-menu" aria-label="Abrir menu"><svg><use href="#i-menu"/></svg></button>
      <a class="logo" href="#/" id="logo"></a>
      <nav class="menu" id="menu" aria-label="Navegação principal"></nav>
      <div class="acoes">
        <button class="icone-btn" id="btn-busca" aria-label="Buscar"><svg><use href="#i-search"/></svg></button>
        <a class="icone-btn" href="#/favoritos" aria-label="Favoritos"><svg><use href="#i-heart"/></svg><span class="bolinha" id="cont-fav" hidden></span></a>
        <button class="icone-btn" id="btn-tema" aria-label="Alternar tema"><svg><use href="#i-moon"/></svg></button>
        <button class="icone-btn" id="btn-carrinho" aria-label="Carrinho"><svg><use href="#i-bag"/></svg><span class="bolinha" id="cont-car" hidden></span></button>
      </div>
    </div>
    <form class="barra-busca" id="barra-busca" hidden role="search">
      <svg><use href="#i-search"/></svg>
      <input type="search" id="campo-busca" placeholder="Buscar produtos, marcas…" aria-label="Buscar" />
      <button type="button" class="icone-btn" id="fechar-busca" aria-label="Fechar busca"><svg><use href="#i-x"/></svg></button>
    </form>
  </header>

  <!-- menu lateral (mobile) -->
  <div class="gaveta gaveta-esq" id="gaveta-menu" aria-hidden="true">
    <div class="gaveta-painel">
      <div class="gaveta-cab"><strong>Categorias</strong><button class="icone-btn" data-fechar aria-label="Fechar"><svg><use href="#i-x"/></svg></button></div>
      <nav class="gaveta-lista" id="menu-mobile"></nav>
    </div>
  </div>

  <!-- carrinho -->
  <div class="gaveta gaveta-dir" id="gaveta-carrinho" aria-hidden="true">
    <div class="gaveta-painel">
      <div class="gaveta-cab"><strong>Seu carrinho</strong><button class="icone-btn" data-fechar aria-label="Fechar"><svg><use href="#i-x"/></svg></button></div>
      <div class="carrinho-itens" id="carrinho-itens"></div>
      <div class="carrinho-rodape" id="carrinho-rodape"></div>
    </div>
  </div>

  <main id="conteudo" tabindex="-1"></main>

  <footer class="rodape" id="rodape"></footer>

  <a class="whats-flutuante" id="whats-flutuante" target="_blank" rel="noopener" aria-label="Falar no WhatsApp"><svg><use href="#i-whats"/></svg></a>
  <div class="aviso-toast" id="toast" role="status" aria-live="polite"></div>
  <button class="subir" id="subir" aria-label="Voltar ao topo"><svg><use href="#i-up"/></svg></button>

  <!-- ícones (desenhados aqui, sem bibliotecas externas) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></symbol>
      <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
      <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"/></symbol>
      <symbol id="i-ruler" viewBox="0 0 24 24"><path d="M3 16 16 3l5 5L8 21z"/><path d="m7 12 2 2M10 9l2 2M13 6l2 2"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
      <symbol id="i-truck" viewBox="0 0 24 24"><path d="M3 6h11v10H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/></symbol>
      <symbol id="i-pix" viewBox="0 0 24 24"><path d="m12 3 9 9-9 9-9-9z"/><path d="m8 12 4-4 4 4-4 4z"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></symbol>
      <symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.3-7-12a7 7 0 0 1 14 0c0 5.7-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>
      <symbol id="i-insta" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></symbol>
      <symbol id="i-whats" viewBox="0 0 24 24"><path d="M4 20l1.3-4A8 8 0 1 1 8.4 19z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1.2-1.4-2-1-1 .8a4 4 0 0 1-2-2l.8-1-1-2z"/></symbol>
      <!-- ícones de categoria -->
      <symbol id="c-shirt" viewBox="0 0 24 24"><path d="M8 3 3 6l2 4 2-1v11h10V9l2 1 2-4-5-3a4 4 0 0 1-8 0z"/></symbol>
      <symbol id="c-sneaker" viewBox="0 0 24 24"><path d="M2 17v-5l5-1 3 2 4-1 6 2c1.5.5 2 1.5 2 3H2zM2 17h20v2H2z"/></symbol>
      <symbol id="c-cap" viewBox="0 0 24 24"><path d="M3 15a9 9 0 0 1 18 0H3z"/><path d="M12 15c4 0 9 .5 10 2H12"/></symbol>
      <symbol id="c-pants" viewBox="0 0 24 24"><path d="M6 3h12l1 18h-5l-2-11-2 11H5z"/></symbol>
      <symbol id="c-hoodie" viewBox="0 0 24 24"><path d="M9 3a3 3 0 0 0 6 0l5 3v14H4V6z"/><path d="M9 3c0 3 1 5 3 5s3-2 3-5M8 15h8"/></symbol>
      <symbol id="c-skate" viewBox="0 0 24 24"><path d="M3 12h18a2 2 0 0 1 0 2H3a2 2 0 0 1 0-2z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
      <symbol id="c-watch" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M9 6l1-4h4l1 4M9 18l1 4h4l1-4M12 9v3l2 1"/></symbol>
      <symbol id="c-shorts" viewBox="0 0 24 24"><path d="M5 4h14l1 12h-6l-2-5-2 5H4z"/></symbol>
      <symbol id="c-bag" viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="14" rx="3"/><path d="M9 7V5a3 3 0 0 1 6 0v2M9 13h6"/></symbol>
      <symbol id="c-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></symbol>
    </defs>
  </svg>

  <script src="js/config.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
